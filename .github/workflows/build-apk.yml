
name: Compilar APK SHADOWHAT

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extraer proyecto SHADOWHAT
        shell: bash
        run: |
          mkdir -p appsrc
          unzip -o SHADOWHAT-Android-Kotlin-Compose.zip -d appsrc
          PROJECT_FILE=$(find appsrc -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "No se encontro settings.gradle(.kts) dentro del ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Preparar archivo APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "No se encontro la APK compilada"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/SHADOWHAT-debug.apk"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SHADOWHAT-APK
          path: SHADOWHAT-debug.apk
          if-no-files-found: error
          
