name: Compilar APK SHADOWHAT

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Extraer proyecto Android del ZIP
        run: |
          mkdir -p appsrc
          unzip -o SHADOWHAT-Android-Kotlin-Compose.zip -d appsrc
          test -f appsrc/app/build.gradle.kts
      - name: Compilar APK de prueba
        run: gradle -p appsrc assembleDebug --no-daemon
      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: SHADOWHAT-APK-debug
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
