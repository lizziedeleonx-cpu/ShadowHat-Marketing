name: Compilar APK SHADOWHAT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detectar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "Buscando Android SDK..."
          ls -la /usr/local/lib/android/sdk
          ls -la /usr/local/lib/android/sdk/platforms
          ls -la /usr/local/lib/android/sdk/build-tools

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extraer proyecto SHADOWHAT
        shell: bash
        run: |
          mkdir -p appsrc
          unzip -o SHADOWHAT-Android-Kotlin-Compose.zip -d appsrc
          PROJECT_FILE=$(find appsrc -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontro settings.gradle o settings.gradle.kts dentro del ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Buscar APK compilada
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: No se encontro el archivo APK."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/SHADOWHAT-debug.apk"
          echo "APK preparada correctamente."

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SHADOWHAT-APK
          path: SHADOWHAT-debug.apk
          if-no-files-found: error
          retention-days: 14
